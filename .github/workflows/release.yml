name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm,   goarm: '7' }
          - { goos: linux,   goarch: '386' }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
          - { goos: linux,   goarch: riscv64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: '386' }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Resolve modules
        run: go mod tidy

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          suffix=""
          if [ "${GOARCH}" = "arm" ] && [ -n "${GOARM}" ]; then
            suffix="v${GOARM}"
          fi
          name="netbox-glean_${version}_${GOOS}_${GOARCH}${suffix}"
          binary="netbox-glean"
          if [ "${GOOS}" = "windows" ]; then
            binary="${binary}.exe"
          fi
          mkdir -p "dist/${name}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${name}/${binary}" ./cmd/netbox-glean
          cp README.md LICENSE "dist/${name}/"
          (
            cd dist
            if [ "${GOOS}" = "windows" ]; then
              zip -qr "${name}.zip" "${name}"
            else
              tar -czf "${name}.tar.gz" "${name}"
            fi
            rm -rf "${name}"
          )
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: netbox-glean-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true