name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Resolve modules
        run: go mod tidy

      - name: Show module diff
        run: git --no-pager diff -- go.mod go.sum || true

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile smoke test
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o /tmp/netbox-glean-linux ./cmd/netbox-glean
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/netbox-glean.exe ./cmd/netbox-glean
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o /tmp/netbox-glean-darwin ./cmd/netbox-glean
          ls -lh /tmp/netbox-glean*

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t netbox-glean:ci .